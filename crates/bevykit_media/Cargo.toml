[package]
name = "bevykit_media"
description = "Audio buses, cues, music, scene bindings, and animation helpers for Bevy."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["audio", "animation"]
audio = ["bevy/bevy_audio"]
scene = ["bevy/bevy_world_serialization"]
animation = ["scene", "bevy/bevy_animation", "bevy/bevy_gltf", "bevy/gltf_animation"]

[dependencies]
bevy = { workspace = true, features = ["std", "bevy_log"] }
bevykit_core = { workspace = true }
fastrand = { workspace = true }

[lints]
workspace = true
